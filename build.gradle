plugins {
    id 'fabric-loom' version "1.0-SNAPSHOT"
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "1.6.10"
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "legacy-fabric"
        url = "https://maven.legacyfabric.net"
    }
    maven { url "https://jitpack.io" }
    mavenCentral()
}

// Loom adds Mojang's library repository before the repositories declared here.
// Gradle remembers which repository supplied a module's metadata and then looks
// for classifier artifacts (the natives) only in that repository.  Mojang does
// not host the ARM classifier jars, so keep all of org.lwjgl on Maven Central.
repositories.all { repo ->
    if (repo instanceof MavenArtifactRepository
            && repo.url != null
            && repo.url.toString().contains("libraries.minecraft.net")) {
        repo.content {
            excludeGroup "org.lwjgl"
        }
    }
}

loom {
    // 1.8.9 is served by Legacy Fabric's intermediary repository.
    setIntermediaryUrl('https://maven.legacyfabric.net/net/fabricmc/intermediary/%1$s/intermediary-%1$s-v2.jar')
}

import org.gradle.internal.os.OperatingSystem

project.ext.lwjglVersion = "3.3.1"

// Ship every desktop platform LWJGL publishes natives for.  The old build chose
// one classifier for the machine that happened to run Gradle, which made the
// resulting jar Linux-only (or Windows-only, etc.).  A mod jar has to work on
// whatever machine the player uses, so all of them are bundled.
project.ext.lwjglNativePlatforms = [
        "natives-windows",
        "natives-windows-x86",
        "natives-windows-arm64",
        "natives-linux",
        "natives-linux-arm64",
        "natives-linux-arm32",
        "natives-macos",
        "natives-macos-arm64"
]

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.legacyfabric:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("org.jetbrains.kotlin:kotlin-stdlib")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-common")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")

    implementation("org.javassist:javassist:3.29.2-GA")
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    // Pure Java EGL bindings. Only used by the Android path (private pbuffer
    // context); harmless on desktop and tiny compared with the natives.
    implementation "org.lwjgl:lwjgl-egl"

    // Vulkan dependencies.
    implementation "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-vma:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    implementation "org.joml:joml:1.10.4"

    // Natives for every supported desktop platform.  Vulkan itself is loaded
    // from the system driver; only macOS bundles a loader (MoltenVK).
    for (String platform : project.lwjglNativePlatforms) {
        runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:$platform"
        runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:$platform"
        runtimeOnly "org.lwjgl:lwjgl-openal:$lwjglVersion:$platform"
        runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:$platform"
        runtimeOnly "org.lwjgl:lwjgl-vma:$lwjglVersion:$platform"
        runtimeOnly "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$platform"
    }

    // MoltenVK is the Vulkan implementation on macOS.
    runtimeOnly "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos-arm64"
}

configurations.all {
    // Keep the legacy LWJGL2 implementation out of the compile/runtime classpath.
    // Legacy LWJGL3 provides the compatibility shims under org.lwjgl.* instead.
    exclude group: "org.lwjgl.lwjgl"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (JavaVersion.current().isJava9Compatible()) it.options.release = 8
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

java {
    withSourcesJar()
}

jar {
    // The normal jar is not self contained (Kotlin, LWJGL3 and the Vulkan
    // bindings live in dependencies).  Only the remapped shadow jar is shippable.
    archiveClassifier = "slim"
}

shadowJar {
    archiveClassifier = "shadow"
    minimize {
        exclude(dependency("org.lwjgl:lwjgl:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-glfw:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-openal:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-opengl:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-vulkan:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-vma:$lwjglVersion"))
        exclude(dependency("org.lwjgl:lwjgl-shaderc:$lwjglVersion"))
        exclude(dependency("org.joml:joml:1.10.4"))
    }
    dependencies {
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib"))
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib-common"))
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk7"))
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk8"))
        include(dependency("org.javassist:javassist:3.29.2-GA"))

        include(dependency("org.lwjgl:lwjgl:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-glfw:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-openal:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-opengl:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-egl:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-vulkan:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-vma:$lwjglVersion"))
        include(dependency("org.lwjgl:lwjgl-shaderc:$lwjglVersion"))
        include(dependency("org.joml:joml:1.10.4"))
    }
}

task remapShadowJar(type: net.fabricmc.loom.task.RemapJarTask, dependsOn: shadowJar) {
    input = shadowJar.archiveFile
    archiveFileName = "${archivesBaseName}-${project.version}.jar"
    addNestedDependencies = false
}

// ---------------------------------------------------------------------------
// Android / Pojav Launcher flavour.
//
// Pojav runs the game on a desktop JVM over Android.  Its parent class loader
// already provides LWJGL core, GLFW, OpenAL and OpenGL (patched for gl4es),
// so those classes and their desktop natives must NOT be bundled here: Knot
// is child-first and would shadow the launcher's Android builds with ELF
// files that need glibc.  The Vulkan, VMA, shaderc and EGL bindings are not
// part of Pojav's classpath, so they are bundled together with Android
// natives for every ABI.  Pojav's dlopen hook extracts and loads them.
// ---------------------------------------------------------------------------
configurations {
    androidBundle
}

dependencies {
    // LWJGL 3.3.3 is the first release with VK_KHR_android_surface bindings.
    androidBundle "org.lwjgl:lwjgl-vulkan:3.3.3"
    androidBundle "org.lwjgl:lwjgl-vma:3.3.3"
    androidBundle "org.lwjgl:lwjgl-shaderc:3.3.3"
    androidBundle "org.lwjgl:lwjgl-egl:3.3.3"
    // Only GL and GLCapabilities are taken from this jar (see androidJar).
    // Pojav patches its own GL.createCapabilities() to call
    // glfwMakeContextCurrent(), which is invalid while Vulkan owns the
    // ANativeWindow, so the mod ships the unpatched LWJGL class.
    androidBundle "org.lwjgl:lwjgl-opengl:3.3.3"

    androidBundle "org.jetbrains.kotlin:kotlin-stdlib:1.6.10"
    androidBundle "org.jetbrains.kotlin:kotlin-stdlib-common:1.6.10"
    androidBundle "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.10"
    androidBundle "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.10"
    androidBundle "org.javassist:javassist:3.29.2-GA"
    androidBundle "org.joml:joml:1.10.4"
}

task androidJar(type: Jar) {
    group = "build"
    description = "Bundles the Android/Pojav flavour of the mod."
    // The remapped jar uses the final "-android" name; keep the intermediate
    // under a different classifier so the two tasks cannot overwrite each other.
    archiveClassifier = "android-raw"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output

    from({ configurations.androidBundle.collect { it.isDirectory() ? it : zipTree(it) } }) {
        include "org/lwjgl/vulkan/**"
        include "org/lwjgl/util/vma/**"
        include "org/lwjgl/util/shaderc/**"
        include "org/lwjgl/egl/**"
        include "org/lwjgl/opengl/GL.class"
        include "org/lwjgl/opengl/GL\$*.class"
        include "org/lwjgl/opengl/GLCapabilities.class"
        include "kotlin/**"
        include "org/jetbrains/annotations/**"
        include "javassist/**"
        include "org/joml/**"
        include "META-INF/*.kotlin_module"
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
        exclude "module-info.class"
        exclude "META-INF/versions/**"
    }

    // Android natives, laid out exactly like the LWJGL natives jars so that
    // Library.loadNative/loadSystem can discover them on the classpath.
    from("android/natives")
    exclude "**/*.sha1"
}

task remapAndroidJar(type: net.fabricmc.loom.task.RemapJarTask, dependsOn: androidJar) {
    input = androidJar.archiveFile
    archiveFileName = "${archivesBaseName}-${project.version}-android.jar"
    addNestedDependencies = false
}

build.dependsOn remapAndroidJar

// `build` must produce the installable jar, not only the slim class jar.
build.dependsOn remapShadowJar

// Keep the normal Loom remap output separate from the installable shadow jar.
remapJar {
    archiveClassifier = "slim-remapped"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}
